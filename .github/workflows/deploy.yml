name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Pnpm Bawaan Proyek
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Modifikasi Konfigurasi Vite Otomatis
        run: |
          # Memaksa robot membaca file App.tsx di halaman luar secara langsung
          sed -i 's|"src/main.tsx"|"main.tsx"|g' index.html || true
          sed -i 's|/src/main.tsx|main.tsx|g' index.html || true

      - name: Build Proyek Tanpa Pengecekan Ketat TypeScript
        run: pnpm exec vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
