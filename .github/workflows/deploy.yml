name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Kembali menggunakan main sesuai sistem GitHub kamu

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix Config for Flat Structure
        run: |
          # Perintah khusus untuk memindahkan App.tsx dll ke tempat yang dibaca Vite
          mkdir -p src
          cp App.tsx main.tsx index.css vite-env.d.ts src/ 2>/dev/null || true

      - name: Build Proyek
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
